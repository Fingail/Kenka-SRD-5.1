name: kenka-srd-51
x-app: &app
  image: kenka-local/app:3.17
  build:
    context: .
    dockerfile: docker/local/Dockerfile
    args:
      WWWGROUP: '${WWWGROUP:-1000}'
  environment:
    WWWUSER: '${WWWUSER:-1000}'
    LARAVEL_SAIL: '1'
    XDEBUG_MODE: 'off'
  volumes:
    - '.:/var/www/html'
  networks: [local]
  restart: unless-stopped
services:
  laravel.test:
    <<: *app
    ports: ['127.0.0.1:${APP_PORT:-18081}:8080']
    mem_limit: 1g
    depends_on:
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
      mailpit: {condition: service_started}
      reverb: {condition: service_started}
  builder:
    <<: *app
    command: ['yarn', 'build']
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: '1'
      NODE_OPTIONS: '--max-old-space-size=3072'
    mem_limit: 4g
    restart: 'no'
    profiles: [build]
  worker:
    <<: *app
    command: ['php', 'artisan', 'queue:work', '--queue=default,heavy', '--sleep=3', '--tries=1', '--timeout=1800', '--memory=384']
    mem_limit: 512m
    depends_on:
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
  reverb:
    <<: *app
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
    ports: ['127.0.0.1:${REVERB_PORT:-18080}:8080']
    mem_limit: 192m
    depends_on:
      redis: {condition: service_healthy}
  mariadb:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    command: ['--innodb-buffer-pool-size=256M', '--max-connections=50']
    volumes:
      - 'database:/var/lib/mysql'
      - './docker/local/init-logs.sh:/docker-entrypoint-initdb.d/10-logs.sh:ro'
    networks: [local]
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    volumes: ['redis:/data']
    networks: [local]
    mem_limit: 192m
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: kenka-local/minio:2025-10-15
    build:
      context: .
      dockerfile: docker/local/minio.Dockerfile
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD}'
    ports: ['127.0.0.1:${MINIO_PORT:-19000}:9000', '127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001']
    volumes: ['objects:/data']
    networks: [local]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 30
  thumbor:
    image: beeyev/thumbor-s3:7.1-slim-alpine
    environment:
      LOG_LEVEL: warning
      LOADER: thumbor_aws.loader
      AWS_LOADER_REGION_NAME: us-east-1
      AWS_LOADER_BUCKET_NAME: kanka
      AWS_LOADER_S3_ACCESS_KEY_ID: '${MINIO_ROOT_USER}'
      AWS_LOADER_S3_SECRET_ACCESS_KEY: '${MINIO_ROOT_PASSWORD}'
      AWS_LOADER_S3_ENDPOINT_URL: http://minio:9000/
      RESULT_STORAGE: thumbor_aws.result_storage
      AWS_RESULT_STORAGE_BUCKET_NAME: thumbnails
      AWS_RESULT_STORAGE_S3_ACCESS_KEY_ID: '${MINIO_ROOT_USER}'
      AWS_RESULT_STORAGE_S3_SECRET_ACCESS_KEY: '${MINIO_ROOT_PASSWORD}'
      AWS_RESULT_STORAGE_S3_ENDPOINT_URL: http://minio:9000/
      AWS_RESULT_STORAGE_REGION_NAME: us-east-1
      AWS_RESULT_STORAGE_ROOT_PATH: rs
      RESULT_STORAGE_STORES_UNSAFE: 'True'
      ALLOW_UNSAFE_URL: 'True'
      AUTO_WEBP: 'True'
      RESPECT_ORIENTATION: 'True'
    volumes: ['thumbnails:/data']
    networks: [local]
    mem_limit: 384m
    restart: unless-stopped
    depends_on:
      minio: {condition: service_healthy}
  thumbor-nginx:
    image: nginx:1.28-alpine
    volumes: ['./.nginx:/etc/nginx/conf.d:ro']
    ports: ['127.0.0.1:${THUMBOR_PORT:-18889}:80']
    networks: [local]
    mem_limit: 64m
    restart: unless-stopped
    depends_on: [thumbor]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['127.0.0.1:${MAILPIT_PORT:-18025}:8025']
    networks: [local]
    mem_limit: 96m
    restart: unless-stopped
  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    environment:
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: '${MEILISEARCH_KEY}'
      MEILI_MAX_INDEXING_MEMORY: 128Mb
      MEILI_MAX_INDEXING_THREADS: '1'
    volumes: ['search:/meili_data']
    networks: [local]
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 30
networks:
  local:
    name: ${LOCAL_NETWORK_NAME:-kenka-local}
volumes:
  database:
  redis:
  objects:
  thumbnails:
  search:
