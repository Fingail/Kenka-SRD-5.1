<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DiceCloud × Dungeon Revealer</title><style>
*{box-sizing:border-box}body{margin:0;background:#101a2b;color:#e9eef7;font:13px/1.45 system-ui}button,input,select,textarea{font:inherit;border-radius:5px;padding:6px 9px;border:1px solid #58708e}button{background:#233b5b;color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input,select,textarea{background:#fff;color:#172235}a{color:#9fcaff}#map{position:fixed;inset:0;width:calc(100vw - 420px);height:100vh;border:0;background:#101a2b}#tools{position:fixed;top:10px;left:88px;z-index:5;display:flex;gap:5px}.panel{position:fixed;right:0;top:0;bottom:0;width:420px;background:#17263d;border-left:1px solid #60748e;display:flex;flex-direction:column;z-index:10}.heading{display:flex;gap:5px;align-items:center;padding:8px;border-bottom:1px solid #526680}.heading h2{font-size:16px;flex:1;margin:0}.sheet{padding:12px;overflow:auto;flex:1;min-height:160px}.sheet h2{margin:0}.sheet h3{margin:15px 0 6px}.row{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}.card{padding:8px;margin:7px 0;background:#203653;border:1px solid #526982;border-radius:6px}.muted{color:#b1bfd2}.health-green{color:#96efb1}.health-yellow{color:#ffe281}.health-red{color:#ffaaaa}.badge{display:inline-block;background:#284e79;border-radius:5px;padding:3px 7px;font-weight:700;margin:2px}.natural-1{background:#991b1b;color:#fff}.natural-20{background:#166534;color:#fff}.damage{border-left:3px solid #f87171}.healing{border-left:3px solid #68d391}#log{overflow:auto;flex:1;padding:8px;min-height:130px;border-top:1px solid #526680}#log h3{margin:0}.log-entry{padding:6px;border-bottom:1px solid #405978;white-space:pre-wrap}#tracker{position:fixed;left:12px;top:56px;bottom:12px;width:300px;z-index:5;background:#17263dee;border:1px solid #60748e;border-radius:7px;overflow:auto;padding:9px}#tracker.min{bottom:auto;width:240px}#tracker header{display:flex;align-items:center;gap:6px}#tracker header strong{flex:1}#tracker li{margin:6px 0;padding:3px}#tracker li.active{border-left:3px solid #9becad;background:#28513c}.floating{position:fixed!important;right:435px;top:50px;width:420px;height:80vh;resize:both;border:1px solid #60748e;z-index:15;background:#17263d;overflow:auto}.floating header{cursor:move}.collapsed{display:none!important}dialog{background:#17263d;color:#eef4ff;border:1px solid #7e94b2;border-radius:9px;width:480px;max-width:95vw;max-height:88vh;overflow:auto}dialog::backdrop{background:#0008}dialog h2{font-size:18px;margin:0}.dialog-head{display:flex;gap:8px;align-items:center}.dialog-head h2{flex:1}label{display:block;margin:7px 0}label input{margin-right:8px}#status{position:fixed;bottom:8px;left:330px;z-index:30;background:#17263ded;padding:5px 10px;max-width:calc(100vw - 780px);border-radius:5px}#login{position:fixed;inset:0;z-index:100;background:#101a2b;display:grid;place-items:center}#login form{padding:25px;background:#17263d;border:1px solid #526680;border-radius:9px;width:350px}#login input{display:block;width:100%;margin:10px 0}details p{white-space:pre-wrap}button.turn{background:#206d43}.notice{padding:8px;background:#70551b;border-radius:5px}.log-window{display:flex;flex-direction:column;flex:1;min-height:150px}#logHost{display:flex;flex-direction:column;flex:1;min-height:170px}#sheetHost{display:flex;flex-direction:column;flex:1.2;min-height:200px}.tiny{padding:3px 6px}.fullscreen-map #map{width:100vw}.fullscreen-map .panel{top:auto;height:38px}.fullscreen-map #sheetHost,.fullscreen-map #logHost{display:none}
</style></head><body>
<iframe id="map" title="Dungeon Revealer map"></iframe><nav id="tools"><a id="kankaQuest" hidden target="_blank" rel="noopener">Kanka quest</a><a id="nativeTables" href="/tabletops" target="_blank">DiceCloud tabletops</a><button id="rosterButton">Characters</button><button id="startButton">Start combat</button><button id="requestsButton">Requests</button><button id="objectButton">Add object</button></nav>
<section id="tracker" aria-label="Turn order"></section>
<aside class="panel" aria-label="Combat panel"><header class="heading"><h2 id="battleTitle">DiceCloud gameplay</h2><button id="panelMin" title="Minimize panel">⌄</button><button id="logout">Sign out</button></header><section id="sheetHost"><header class="heading"><h2>Character sheet</h2><button id="sheetPop" title="Pop out character sheet">‹</button><button id="sheetClose" title="Close sheet">×</button></header><section class="sheet" id="sheet" aria-label="Character sheet"></section></section><section id="logHost"><header class="heading"><h2>Shared combat log</h2><button id="logPop" title="Pop out combat log">‹</button></header><div id="log" role="log" aria-label="Shared combat log"></div></section></aside>
<div id="status" role="status"></div><div id="login"><form><h2>DiceCloud encounter</h2><p>Sign in with a demo DiceCloud participant account.</p><input name="username" aria-label="Username" autocomplete="username" required><input name="password" aria-label="Password" type="password" autocomplete="current-password" required><button>Sign in</button><p class="error"></p></form></div>
<script src="/dc-dr/client.js"></script></body></html>
